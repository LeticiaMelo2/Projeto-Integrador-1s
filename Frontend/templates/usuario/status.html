<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
    <title>Consulta de ocorrências</title>
</head>

<body class="body-status">

    <div class="container-status">

        <h1>Minhas ocorrências</h1>

        <div style="text-align: right; margin-bottom: 20px;">
            <a href="{{ url_for('usuario.home') }}">
                <button style="
                    background-color: #fff;
                    border: none;
                    border-radius: 40px;
                    padding: 8px 20px;
                    cursor: pointer;
                    font-size: 14px;
                    color: rgb(72, 195, 244);
                    font-weight: 600;
                    box-shadow: 0 0 10px rgb(0, 0, .1);
                ">
                    Home
                </button>
            </a>
        </div>

        <div class="status">

            <label for="filtro">Filtrar por status:</label>

            <form method="GET" action="/ocorrencias">

                <div class="select">

                    <select name="filtro" id="filtro" onchange="this.form.submit()">

                        <option value="todos"
                            {% if filtro == 'todos' %}selected{% endif %}>
                            Todos
                        </option>

                        <option value="aberta"
                            {% if filtro == 'aberta' %}selected{% endif %}>
                            Aberta
                        </option>

                        <option value="em andamento"
                            {% if filtro == 'em andamento' %}selected{% endif %}>
                            Em andamento
                        </option>

                        <option value="finalizada"
                            {% if filtro == 'finalizada' %}selected{% endif %}>
                            Finalizada
                        </option>

                    </select>

                </div>

            </form>

        </div>

        <hr>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>

                {% for item in dados %}

                <tr>

                    <td>{{ item.id }}</td>

                    <td>{{ item.titulo }}</td>


                    <td>

                        {{ item.status }}

                    </td>
                    <td>
    <div style="display: flex; justify-content: center; align-items: center; gap: 12px;">

        <a href="{{ url_for('usuario.historico', solicitacao_id=item.id) }}">
            <i class='bx bx-file' title="Histórico" style="font-size: 24px; color: white;"></i>
        </a>

        {% if item.status.lower() == 'aberta' %}

        <form method="POST"
              action="{{ url_for('usuario.cancelar_ocorrencia', solicitacao_id=item.id) }}"
              style="display: inline; margin: 0;">

            <button type="submit" title="Cancelar ocorrência"
                    style="border: none; background: none; cursor: pointer; padding: 0;">

                <i class='bx bx-x-circle'
                   style="font-size: 24px; color: white;"></i>

            </button>

        </form>

        {% endif %}

    </div>
</td>

                </tr>

                {% endfor %}

                {% if not dados %}

                <tr>
                    <td colspan="3">
                        Nenhuma ocorrência encontrada.
                    </td>
                </tr>

                {% endif %}

            </tbody>

        </table>

    </div>

</body>
</html>
